name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build
        run: node scripts/check-build.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lampa-tor-updater
          path: dist/plugin.js

      - name: Publish build branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: build
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: 'build: ${{ github.sha }}'
